[package]
name = "cairn-plan"
version = "0.16.5"
edition = "2021"
rust-version = "1.85"
description = "Projects and tickets for a small team: one binary, one SQLite file, sign-in left to an authenticating reverse proxy, approval of a ticket reserved to project owners"
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
# bundled: SQLite is compiled in, the image needs no system library
rusqlite = { version = "0.32", features = ["bundled"] }
# signature of forge webhooks (HMAC-SHA256)
hmac = "0.12"
sha2 = "0.10"
# notifications: e-mail over SMTP with TLS, ntfy over HTTPS (rustls, bundled roots)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
