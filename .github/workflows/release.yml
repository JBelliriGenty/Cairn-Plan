# Builds both images (the builds run the tests, see the Dockerfiles) and
# publishes them to ghcr.io/<owner>/cairn-plan and cairn-plan-agent: "main"
# and "latest" from the main branch, "1.2.3", "1.2" and "1" from a v1.2.3
# tag. A v* tag also creates the GitHub release with its CHANGELOG section.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: cairn-plan, context: . }
          - { name: cairn-plan-agent, context: agent }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          v="${GITHUB_REF_NAME#v}"; o="${GITHUB_REPOSITORY_OWNER,,}"
          notes=$(awk -v v="$v" '$0 ~ "^## " {p = ($2 == v); next} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$notes"$'\n\n'"Images (linux/amd64, linux/arm64): \`ghcr.io/$o/cairn-plan:$v\`, \`ghcr.io/$o/cairn-plan-agent:$v\`."
        env:
          GH_TOKEN: ${{ github.token }}
